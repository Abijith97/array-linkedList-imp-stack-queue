name: Auto Code Review with Claude

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR changes
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"

          git fetch origin $BASE_BRANCH
          DIFF=$(git diff origin/$BASE_BRANCH...HEAD)
          FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD)
          COMMITS=$(git log origin/$BASE_BRANCH..HEAD --pretty=format:"%h - %s")

          echo "$DIFF" > /tmp/pr-diff.txt
          echo "$FILES" > /tmp/changed-files.txt
          echo "$COMMITS" > /tmp/pr-commits.txt

          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_OUTPUT
          echo "PR_TITLE=$(gh pr view $PR_NUM --json title -q .title)" >> $GITHUB_ENV
          echo "PR_AUTHOR=$(gh pr view $PR_NUM --json author -q .author.login)" >> $GITHUB_ENV

      - name: Perform code review with Claude
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node .github/scripts/code-review.js

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW=$(cat /tmp/code-review.txt)
          gh pr comment ${{ steps.pr-info.outputs.PR_NUMBER }} --body "$REVIEW"