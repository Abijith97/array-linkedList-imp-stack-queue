name: Auto Code Review with Claude

on:
  workflow_run:
    workflows: ["Run Google Tests"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  code-review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR changes
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"

          # Only proceed if there is an open PR for this branch
          PR_NUM=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for branch $HEAD_BRANCH, skipping."
            exit 0
          fi

          # Get base branch from the PR
          BASE_BRANCH=$(gh pr view $PR_NUM --json baseRefName -q .baseRefName)

          # Get the diff with file names
          git fetch origin $BASE_BRANCH
          DIFF=$(git diff origin/$BASE_BRANCH...HEAD)

          # Get list of changed files
          FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD)

          # Get commit messages
          COMMITS=$(git log origin/$BASE_BRANCH..HEAD --pretty=format:"%h - %s")

          # Save to files
          echo "$DIFF" > /tmp/pr-diff.txt
          echo "$FILES" > /tmp/changed-files.txt
          echo "$COMMITS" > /tmp/pr-commits.txt

          # Set environment variables
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV
          echo "PR_TITLE=$(gh pr view $PR_NUM --json title -q .title)" >> $GITHUB_ENV
          echo "PR_AUTHOR=$(gh pr view $PR_NUM --json author -q .author.login)" >> $GITHUB_ENV

      - name: Perform code review with Claude
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node .github/scripts/code-review.js

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW=$(cat /tmp/code-review.txt)

          gh pr comment ${{ env.PR_NUMBER }} --body "$REVIEW"
